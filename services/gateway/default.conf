# P6-02: the only door between the host and the stack.
# `gateway` is the only service on `front`; `api` and `ui` stay on `internal`.
# Docker's DNS resolves the names `api` and `ui` on the `internal` network.

# ui: http://localhost:3000
server {
    listen 3000;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Used by the healthcheck of the gateway itself.
    location = /_gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://ui:3000;
    }
}

# api: http://localhost:8000
server {
    listen 8000;
    server_name _;

    # config.yaml: uploads.max_bytes = 20 MB per file, plus multipart overhead.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # /ask streams the answer: nothing may be held back by nginx.
    location /ask {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://api:8000;
    }
}