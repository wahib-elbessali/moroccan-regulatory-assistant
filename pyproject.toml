[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-reglementaire"
version = "0.0.0"
description = "Agentic RAG assistant for Moroccan regulation, on Arabic documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API, config, auth (P5)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    # HTTP clients (P6 and others)
    "httpx>=0.27",
    # Retrieval (P2)
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    # Orchestration (P3)
    "langgraph>=0.2",
    # Ingestion (P1)
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "pillow>=10.3",
    # Token counting (P6)
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "pre-commit>=3.7",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are left to black

[tool.mypy]
python_version = "3.11"
packages = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_empty = true

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
